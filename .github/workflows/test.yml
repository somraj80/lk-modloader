name: modloader

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm curl xz-utils

      - name: Setup LK + ATfE
        run: ./setup.sh

      - name: Build modloader
        run: cd build/lk && make modloader -j"$(nproc)"

      - name: Run M1-M6 tests
        run: cd build/lk && bash ./app/modloader/run_modtest_all.sh
